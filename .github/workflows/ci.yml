# SeeChange Studio deploy.
# Triggered by a Release created by the stringify step in seechange-studio.
#
# Secrets:   ACTION_TOKEN, REMOTE_SSH_KEY
# Variables: AWS_ROLE_ARN, AWS_REGION, REMOTE_USER, AWS_ECR_REPOSITORY
name: SeeChange Studio - Build and push

# Public repository. Do not print parameter values, tokens, or key files.
# A release here is created by Parse-Action-Tag (type stringify) from seechange-studio.
on:
  release:
    types: [published]

jobs:
  action_trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    outputs:
      remote_host: ${{ steps.deploy-vars.outputs.remote_host }}
      teams_webhook: ${{ steps.deploy-vars.outputs.teams_webhook }}
      active: ${{ steps.deploy-vars.outputs.active }}
      image_tag: ${{ steps.deploy-vars.outputs.image_tag }}
      source_repo: ${{ steps.deploy-vars.outputs.source_repo }}
      ecr_registry: ${{ steps.login-pf-aws-ecr.outputs.registry }}
    steps:
      - name: get tag info
        uses: Seechange-edu/Parse-Action-Tag@main
        with:
          githubToken: ${{ secrets.ACTION_TOKEN }}
          type: parse

      - name: Export deploy vars
        id: deploy-vars
        run: |
          {
            echo "remote_host=${{ env.REMOTE_HOST }}"
            echo "teams_webhook=${{ env.TEAMS_WEBHOOK }}"
            echo "active=${{ env.ACTIVE }}"
            echo "image_tag=${{ env.BRANCH }}"
            echo "source_repo=Seechange-edu/${{ env.REPOSITORY }}"
          } >> "$GITHUB_OUTPUT"

      - name: checkout code
        uses: actions/checkout@v4
        with:
          repository: SeeChange-edu/${{ env.REPOSITORY }}
          token: ${{ secrets.ACTION_TOKEN }}
          ref: ${{ env.BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package the runtime archive the image build requires
        env:
          GH_TOKEN: ${{ secrets.ACTION_TOKEN }}
          STUDIO_SOURCE_REPO: Seechange-edu/${{ env.REPOSITORY }}
        run: |
          set -eu
          python -m pip install -r backend/requirements.txt -r backend/requirements-metadata.txt
          lock=backend/runtime-bundle.json
          if [ ! -f "$lock" ]; then
            python backend/tools/prepare_runtime.py
            exit
          fi
          source_tag=$(jq -er '.tag | select(type == "string" and test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$lock")
          asset=$(jq -er '.asset | select(type == "string" and test("^studio-runtime-[a-f0-9]{12}\\.tar\\.gz$"))' "$lock")
          sha=$(jq -er '.sha256 | select(type == "string" and test("^[a-f0-9]{64}$"))' "$lock")
          incoming=$(mktemp -d)
          gh release download "$source_tag" --repo "$STUDIO_SOURCE_REPO" --pattern "$asset" --dir "$incoming"
          printf '%s  %s\n' "$sha" "$incoming/$asset" | sha256sum --check
          python backend/tools/qualify_runtime.py "$incoming/$asset"
          cp -- "$incoming/$asset" backend/runtime-source.tar.gz

      - name: Setup AWS ECR Details (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        timeout-minutes: 3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ECR-Push
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Login to AWS ECR
        id: login-pf-aws-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          ACTIVE: ${{ env.ACTIVE }}
          tagName: ${{ env.BRANCH }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}/${ACTIVE}:${tagName}"
          docker build --tag "${IMAGE_URI}" --file backend/Dockerfile backend
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Get ECR login token
        id: ecr-login-token
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ vars.AWS_REGION }})
          echo "token<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ECR_TOKEN" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: SSH and run the container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_TOKEN,IMAGE_URI
          script: |
            set -eu
            echo "${ECR_TOKEN}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
            docker pull "${IMAGE_URI}"
            DATA_DIR="/home/forge/seechange-studio/${{ env.ACTIVE }}/data"
            if [ ! -d "${DATA_DIR}" ] || [ -L "${DATA_DIR}" ] ||
               [ "$(stat -c '%u' -- "${DATA_DIR}")" != "$(id -u)" ]; then
              echo "Deploy preflight failed: /data must be a real directory owned by the deploy user." >&2
              exit 1
            fi
            if ! command -v setfacl >/dev/null || ! command -v getfacl >/dev/null; then
              echo "Deploy preflight failed: host ACL tools are required to grant UID 10001 access." >&2
              exit 1
            fi
            EXPECTED_ACL=$(printf '%s\n' user::rwx user:10001:rwx group::--- mask::rwx other::---)
            if [ "$(getfacl -cEn -- "${DATA_DIR}")" != "${EXPECTED_ACL}" ]; then
              setfacl --set 'u::rwx,u:10001:rwx,g::---,m::rwx,o::---' -- "${DATA_DIR}"
              setfacl -k -- "${DATA_DIR}"
            fi
            if [ "$(getfacl -cEn -- "${DATA_DIR}")" != "${EXPECTED_ACL}" ] ||
               [ ! -r "${DATA_DIR}" ] || [ ! -w "${DATA_DIR}" ] || [ ! -x "${DATA_DIR}" ]; then
              echo "Deploy preflight failed: the data directory ACL or deploy user access is incorrect." >&2
              exit 1
            fi
            docker version --format 'Docker server version: {{.Server.Version}}'
            docker run --rm -i --network none --user 10001:10001 \
              --mount "type=bind,source=${DATA_DIR},target=/data" \
              --entrypoint python "${IMAGE_URI}" - <<'PY'
            import os
            from pathlib import Path
            import stat
            from tempfile import TemporaryFile

            root = Path("/data")
            backup_bytes = 0
            for name in ("studio.sqlite3", "studio.sqlite3-wal", "studio.sqlite3-shm"):
                path = root / name
                try:
                    info = path.lstat()
                except FileNotFoundError:
                    continue
                if (
                    not stat.S_ISREG(info.st_mode)
                    or (info.st_uid, info.st_gid) != (10001, 10001)
                    or not os.access(path, os.R_OK | os.W_OK)
                ):
                    raise SystemExit(f"Deploy preflight failed: {name} must be a writable regular file owned by 10001:10001.")
                backup_bytes += info.st_size

            capacity = os.statvfs(root)
            available = capacity.f_bavail * capacity.f_frsize
            print(f"Studio volume free bytes: {available}. SQLite file bytes: {backup_bytes}.")
            if available <= backup_bytes:
                raise SystemExit("Deploy preflight failed: insufficient space for a local SQLite backup.")
            with TemporaryFile(dir=root) as probe:
                probe.write(b"Studio deployment volume check\n")
                probe.flush()
            PY
            CONTAINERS=$(docker ps -a --format '{{.Names}}')
            if printf '%s\n' "${CONTAINERS}" | grep -Fxq -- '${{ env.NAME }}'; then
              docker rm -f "${{ env.NAME }}"
            fi
            docker run -d \
              --name "${{ env.NAME }}" \
              --user 10001:10001 \
              -p "127.0.0.1:${{ env.OUT_PORT }}:${{ env.PORT }}" \
              -v "${DATA_DIR}:/data" \
              --restart unless-stopped \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-east-1 \
              --log-opt awslogs-group=/docker/${{ env.NAME }} \
              --log-opt awslogs-stream=${{ env.ACTIVE }} \
              --log-opt awslogs-create-group=true \
              "${IMAGE_URI}"
            for i in $(seq 1 40); do
              if curl -sf "http://127.0.0.1:${{ env.OUT_PORT }}/readyz" >/dev/null; then
                echo "health check passed on attempt ${i}"
                exit 0
              fi
              STATE=$(docker inspect --format '{{.State.Status}} restarting={{.State.Restarting}} exit={{.State.ExitCode}}' "${{ env.NAME }}" 2>/dev/null || echo missing)
              echo "health check attempt ${i}: ${STATE}"
              case "${STATE}" in
                *restarting=true*) echo "container is restarting; aborting wait"; break ;;
              esac
              sleep 3
            done
            echo "health check failed"
            docker logs --tail 200 "${{ env.NAME }}" || true
            exit 1
        env:
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          ECR_TOKEN: ${{ steps.ecr-login-token.outputs.token }}
          IMAGE_URI: ${{ env.IMAGE_URI }}

  changelog:
    needs: [action_trigger]
    if: needs.action_trigger.result == 'success' && startsWith(needs.action_trigger.outputs.image_tag, 'v')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/changelog-run.yml
    with:
      source_repo: ${{ needs.action_trigger.outputs.source_repo }}
      tag: ${{ needs.action_trigger.outputs.image_tag }}
      soft_fail: true
    secrets: inherit

  changelog-notify:
    needs: [action_trigger, changelog]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Tell Teams the notes are ready for review
        if: fromJSON(needs.changelog.outputs.result || '{"branches":[{"url":"","reason":""}]}').branches[0].reason == 'documented'
        continue-on-error: true
        env:
          WEBHOOK: ${{ needs.action_trigger.outputs.teams_webhook }}
          TAG: ${{ needs.action_trigger.outputs.image_tag }}
          SOURCE_REPO: ${{ needs.action_trigger.outputs.source_repo }}
          URL: ${{ fromJSON(needs.changelog.outputs.result || '{"branches":[{"url":"","reason":""}]}').branches[0].url }}
          GH_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || exit 0
          NOTES=$(gh api "repos/${SOURCE_REPO}/releases/tags/${TAG}" --jq .body \
            | awk '/<!-- user-changelog:start -->/{on=1;next}
                   /<!-- user-changelog:end -->/{on=0}
                   on && /<details>/{skip=1}
                   on && !skip && !/^<!--/{print}
                   on && /<\/details>/{skip=0}' \
            | sed -E 's/^#+ +(.*)$/**\1**/' \
            | awk '{n+=length($0)+1; if(n>20000){print "...(truncated - open the release for the rest)"; exit}; print}' \
            ) || NOTES=""
          jq -n \
            --arg title "📝 ${TAG}: user changelog drafted" \
            --arg subtitle "${SOURCE_REPO}" \
            --arg next "AI draft, written below the GitHub notes. Review it before sharing it." \
            --arg url "$URL" \
            --arg notes "$NOTES" \
            '{type: "message", attachments: [{contentType: "application/vnd.microsoft.card.adaptive", content: {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json", type: "AdaptiveCard", version: "1.4",
              body: ([{type: "TextBlock", size: "Medium", weight: "Bolder", wrap: true, text: $title},
                      {type: "TextBlock", spacing: "None", isSubtle: true, wrap: true, text: $subtitle},
                      {type: "TextBlock", spacing: "Medium", wrap: true, text: $next}]
                     + (if $notes == "" then [] else [{type: "TextBlock", spacing: "Medium", separator: true, wrap: true, text: $notes}] end)),
              actions: [{type: "Action.OpenUrl", title: "Open release", url: $url}]}}]}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" >/dev/null \
            || echo "::warning::Could not post to Teams."

  prune-images:
    needs: [action_trigger]
    if: needs.action_trigger.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Prune dangling Docker images
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.action_trigger.outputs.remote_host }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: docker image prune --force

      - name: Prune old semver Docker images
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ needs.action_trigger.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.action_trigger.outputs.image_tag }}
          ACTIVE: ${{ needs.action_trigger.outputs.active }}
        with:
          host: ${{ needs.action_trigger.outputs.remote_host }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ACTIVE
          script: |
            IMAGE_PREFIX="${ECR_REGISTRY}/${ECR_REPOSITORY}/${ACTIVE}"
            CURRENT="${IMAGE_TAG}"
            if ! echo "$CURRENT" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Skip prune: IMAGE_TAG '${CURRENT}' is not semver"
              exit 0
            fi
            mapfile -t TAGS < <(
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep "^${IMAGE_PREFIX}:" \
                | sed "s|^${IMAGE_PREFIX}:||" \
                | grep -E '^[vV][0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V
            )
            PREV=$(printf '%s\n' "${TAGS[@]}" | sort -V | awk -v cur="$CURRENT" '
              { a[++n]=$0 }
              END { for(i=1;i<=n;i++) if(a[i]==cur && i>1) { print a[i-1]; exit } }')
            for tag in "${TAGS[@]}"; do
              [ "$tag" = "$CURRENT" ] && continue
              [ -n "$PREV" ] && [ "$tag" = "$PREV" ] && continue
              docker rmi "${IMAGE_PREFIX}:${tag}" 2>/dev/null || true
            done
